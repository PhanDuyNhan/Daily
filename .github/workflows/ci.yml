name: Check Daily
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/auth-emails.mjs --check
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  database-ownership:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: daily-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: daily-ci
    steps:
      - uses: actions/checkout@v4
      - name: Check ownership with two database identities
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/ownership.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/task_reminders.sql
